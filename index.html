<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#11243b"><title>ClimaAR</title><style>body{margin:0;background:#0d1b2a;color:#f5f9ff;font-family:system-ui,sans-serif}main{max-width:540px;margin:auto;padding:25px}h1{font-size:32px}select,button{font:inherit;padding:12px;border:0;border-radius:12px;width:100%;margin:8px 0}section{background:#1b3048;border-radius:18px;padding:20px;margin:16px 0}.temp{font-size:64px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#b9cde0}#status{min-height:1.5em}</style></head><body><main><h1>☀️ ClimaAR</h1><p class="muted">El clima de Argentina en tiempo real</p><label for="city">Elegí una ciudad</label><select id="city"><option value="-34.6037,-58.3816">Buenos Aires</option><option value="-34.6534,-58.6198">Morón</option><option value="-31.4201,-64.1888">Córdoba</option><option value="-32.9442,-60.6505">Rosario</option><option value="-32.8895,-68.8458">Mendoza</option><option value="-24.7821,-65.4232">Salta</option><option value="-38.0055,-57.5426">Mar del Plata</option><option value="-54.8019,-68.3030">Ushuaia</option></select><button id="refresh">Actualizar pronóstico</button><p id="status" role="status">Cargando...</p><section><div id="place"></div><div class="temp" id="temp">--°</div><div id="desc">Esperando datos...</div><div class="grid"><p>🌡️ Sensación<br><strong id="feels">--</strong></p><p>💧 Humedad<br><strong id="humidity">--</strong></p><p>💨 Viento<br><strong id="wind">--</strong></p><p>🌧️ Lluvia<br><strong id="rain">--</strong></p></div></section><section><h2>Próximos 7 días</h2><div id="days"></div></section><p class="muted">Datos: Open-Meteo. Pronósticos orientativos; consultá el SMN ante alertas oficiales.</p></main><script>const $=id=>document.getElementById(id);function weatherText(c){if(c===0)return'Despejado';if(c<=3)return'Parcialmente nublado';if(c<=48)return'Niebla';if(c<=67)return'Lluvia';if(c<=77)return'Nieve';if(c<=82)return'Chaparrones';if(c<=86)return'Nieve';if(c>=95)return'Tormentas';return'Variable'}async function load(){const [lat,lon]=$('city').value.split(',');$('status').textContent='Actualizando...';$('place').textContent=$('city').selectedOptions[0].text;try{const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=7`;const r=await fetch(url);if(!r.ok)throw Error('Servicio no disponible');const d=await r.json(),c=d.current;$('temp').textContent=Math.round(c.temperature_2m)+'°';$('desc').textContent=weatherText(c.weather_code);$('feels').textContent=Math.round(c.apparent_temperature)+'°C';$('humidity').textContent=c.relative_humidity_2m+'%';$('wind').textContent=Math.round(c.wind_speed_10m)+' km/h';$('rain').textContent=c.precipitation+' mm';$('days').replaceChildren(...d.daily.time.map((date,i)=>{const p=document.createElement('p');p.textContent=`${new Date(date+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric'})}: ${Math.round(d.daily.temperature_2m_min[i])}° / ${Math.round(d.daily.temperature_2m_max[i])}° · ${weatherText(d.daily.weather_code[i])} · Lluvia ${d.daily.precipitation_probability_max[i]??'--'}%`;return p}));$('status').textContent='Pronóstico actualizado'}catch(e){$('status').textContent='No se pudieron cargar los datos. Revisá tu conexión e intentá otra vez.'}}$('city').addEventListener('change',load);$('refresh').addEventListener('click',load);load();</script></body></html>
